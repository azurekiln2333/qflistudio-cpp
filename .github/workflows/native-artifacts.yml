name: Native artifacts

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native dependency packages to build
        type: choice
        default: all
        options:
          - all
          - android
          - ohos
          - ios
          - ohos-resources
  push:
    branches:
      - main
      - ci/native-artifacts
    paths:
      - .github/workflows/native-artifacts.yml
      - native/toolchain/**
      - native/compiler/**
      - native/portable/**
      - native/include/**

permissions:
  contents: read

concurrency:
  group: native-artifacts-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      ABI: ${{ matrix.abi }}
      BUILD_ROOT: ${{ github.workspace }}/native/build/ci-android-${{ matrix.abi }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install fixed build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-15 lld-15 ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
          cmake --version
          pwsh --version
          df -h .
      - name: Build and validate the native toolchain
        run: |
          mkdir -p native/build/ci-logs
          bash native/toolchain/build-android-llvm-linux.sh \
            --abi "$ABI" --jobs 4 --build-root "$BUILD_ROOT" \
            --ndk "$ANDROID_HOME/ndk/27.0.12077973" \
            2>&1 | tee "native/build/ci-logs/android-$ABI.log"
      - name: Package download
        run: |
          python3 native/toolchain/package-ci-artifact.py android \
            --abi "$ABI" --package "$BUILD_ROOT/package" --output native/build/ci-dist
      - name: Upload native package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfli-native-android-${{ matrix.abi }}
          path: native/build/ci-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Describe download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Android $ABI"
            echo "[Download native package]($ARTIFACT_URL) (retained for 30 days)."
            echo 'Contains jniLibs, toolchain assets, validation reports and SHA256SUMS.'
            echo 'Extract the inner tar.gz into native/build/android-package.'
            echo 'This is a native dependency package, not an APK. Device execution was not tested.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-android-${{ matrix.abi }}
          path: |
            native/build/ci-logs/
            native/build/ci-android-${{ matrix.abi }}/host/CMakeCache.txt
            native/build/ci-android-${{ matrix.abi }}/target-${{ matrix.abi }}/CMakeCache.txt
            native/build/ci-android-${{ matrix.abi }}/target-${{ matrix.abi }}/CMakeFiles/CMakeConfigureLog.yaml
            native/build/ci-android-${{ matrix.abi }}/preflight.*/validation/
          if-no-files-found: warn
          retention-days: 7

  ohos-resources:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ohos-resources'
    name: OHOS WASI resources (data only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify pinned archives
        shell: pwsh
        run: ./native/toolchain/prepare-portable-wasm.ps1 -IncludeCompiler -ArchivesOnly
      - name: Package WASI resources
        shell: pwsh
        run: ./native/toolchain/package-ohos-portable.ps1 -Python python3
      - name: Verify and prepare download
        run: |
          mkdir -p native/build/ci-reports
          python3 native/toolchain/verify-ohos-portable-package.py --project-root . \
            | tee native/build/ci-reports/ohos-resources.json
          python3 native/toolchain/package-ci-artifact.py ohos-resources \
            --package ohos/entry/src/main/resources/rawfile/qfli_toolchain \
            --verification native/build/ci-reports/ohos-resources.json \
            --output native/build/ci-dist
      - name: Upload WASI resources
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfli-ohos-wasi-resources
          path: native/build/ci-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Describe download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '### OHOS WASI resources'
            echo "[Download resource package]($ARTIFACT_URL) (retained for 30 days)."
            echo 'Contains ohos-wasi.zip, its SHA256 sidecar, provenance and resource validation.'
            echo 'Copy ohos-wasi.zip and its sidecar into ohos/entry/src/main/resources/rawfile/qfli_toolchain.'
            echo 'This is data only: no OHOS compiler/runtime archives, native bridge, or HAP.'
            echo 'For compiler/runtime archives as well, download qfli-native-ohos-arm64-v8a.'
          } >> "$GITHUB_STEP_SUMMARY"

  ohos:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ohos'
    name: OHOS ARM64 native and resources
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-15 lld-18 llvm-18 make ninja-build
          df -h .
      - name: Download pinned public OHOS SDK
        run: python3 native/toolchain/prepare-ohos-sdk.py --output native/build/ci-ohos-sdk
      - name: Download pinned portable sources
        shell: pwsh
        run: ./native/toolchain/prepare-portable-wasm.ps1 -IncludeCompiler -ArchivesOnly
      - name: Build compiler and interpreter archives
        run: |
          mkdir -p native/build/ci-logs
          bash native/toolchain/build-ohos-portable.sh \
            --native-sdk "$PWD/native/build/ci-ohos-sdk/native" \
            --build-root "$PWD/native/build/ci-ohos" --jobs 4 \
            2>&1 | tee native/build/ci-logs/ohos.log
      - name: Package WASI resources
        shell: pwsh
        run: ./native/toolchain/package-ohos-portable.ps1 -Python python3
      - name: Export complete native package
        run: |
          mkdir -p native/build/ci-reports
          python3 native/toolchain/verify-ohos-portable-package.py --project-root . \
            | tee native/build/ci-reports/ohos-resources.json
          python3 native/toolchain/package-ci-artifact.py ohos \
            --package native/build/ci-ohos/package \
            --resources ohos/entry/src/main/resources/rawfile/qfli_toolchain \
            --verification native/build/ci-reports/ohos-resources.json \
            --output native/build/ci-dist
      - name: Upload OHOS native package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfli-native-ohos-arm64-v8a
          path: native/build/ci-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Describe download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '### OHOS ARM64 native package'
            echo "[Download complete native dependencies]($ARTIFACT_URL) (30 days)."
            echo 'Contains compiler/runtime static archives, headers and WASI resources.'
            echo 'Extract the inner tar.gz at the repository root.'
            echo 'Uses pinned public OpenHarmony SDK 5.1.0.107/API 18; local packages may use a different SDK.'
            echo 'Native dependency package, not a HAP. Device execution is not verified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-ohos
          path: |
            native/build/ci-logs/
            native/build/ci-ohos/**/CMakeCache.txt
            native/build/ci-ohos/**/CMakeConfigureLog.yaml
            native/build/ci-ohos/package/validation/
          if-no-files-found: warn
          retention-days: 7

  ios-slice:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    name: iOS ${{ matrix.slice }}
    runs-on: macos-15-intel
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        slice: [iphoneos-arm64, iphonesimulator-arm64, iphonesimulator-x86_64]
    env:
      SLICE: ${{ matrix.slice }}
      BUILD_ROOT: ${{ github.workspace }}/native/build/ci-ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          cmake --version
          ninja --version
          python3 --version
          df -h .
      - name: Build compiler and interpreter slice
        run: |
          mkdir -p native/build/ci-logs
          bash native/toolchain/build-ios-portable.sh \
            --slice "$SLICE" --no-install --jobs 3 --build-root "$BUILD_ROOT" \
            2>&1 | tee "native/build/ci-logs/ios-$SLICE.log"
      - name: Preserve slice modes in an archive
        run: |
          mkdir -p native/build/ci-slice
          tar -czf "native/build/ci-slice/$SLICE.tar.gz" -C "$BUILD_ROOT/package" .
          shasum -a 256 "native/build/ci-slice/$SLICE.tar.gz" > "native/build/ci-slice/$SLICE.sha256"
      - name: Upload slice for XCFramework assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-slice-${{ matrix.slice }}
          path: native/build/ci-slice/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-ios-${{ matrix.slice }}
          path: |
            native/build/ci-logs/
            native/build/ci-ios/**/CMakeCache.txt
            native/build/ci-ios/**/CMakeConfigureLog.yaml
            native/build/ci-ios/package/validation/
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS XCFramework and resources
    needs: ios-slice
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download all native slices
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ios-slice-*
          path: native/build/ci-slice-downloads
          merge-multiple: true
      - name: Verify and extract slices
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, tarfile
          downloads = pathlib.Path('native/build/ci-slice-downloads')
          for name in ('iphoneos-arm64', 'iphonesimulator-arm64', 'iphonesimulator-x86_64'):
              archive = downloads / (name + '.tar.gz')
              with archive.open('rb') as source:
                  actual = hashlib.file_digest(source, 'sha256').hexdigest()
              if actual != (downloads / (name + '.sha256')).read_text().split()[0]:
                  raise SystemExit('Slice checksum mismatch: ' + name)
              with tarfile.open(archive) as source:
                  source.extractall(pathlib.Path('native/build/ci-slices') / name, filter='data')
          PY
      - name: Assemble and validate XCFramework
        run: |
          python3 native/toolchain/package-ios-xcframework.py assemble \
            --slice-dir native/build/ci-slices/iphoneos-arm64 \
            --slice-dir native/build/ci-slices/iphonesimulator-arm64 \
            --slice-dir native/build/ci-slices/iphonesimulator-x86_64 \
            --output native/build/ci-ios-package
          python3 native/toolchain/package-ci-artifact.py ios \
            --package native/build/ci-ios-package --output native/build/ci-dist
      - name: Upload iOS native package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfli-native-ios
          path: native/build/ci-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Describe download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '### iOS native package'
            echo "[Download XCFramework and resources]($ARTIFACT_URL) (30 days)."
            echo 'Contains device ARM64 and simulator ARM64/x86_64 static libraries, XCFramework, headers and WASI resources.'
            echo 'Extract into native/build/ios-portable/package.'
            echo 'Then run python3 native/toolchain/install-ios-package.py --package native/build/ios-portable/package on your Mac.'
            echo 'Native dependency package, not an IPA. Signing and device execution remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"
