name: qfli_c
description: "QFLIForge：C/C++ 移动端 IDE。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../qfli_studio_core
  qfli_c_runtime:
    path: packages/qfli_c_runtime

  # c_runner.dart 直接用到（解析项目内相对路径）。
  path: ^1.9.1

  # 浏览器平台存储适配层（lib/platform/）。native 上透传 dart:io，
  # web 上用内存文件系统 + IndexedDB 持久化，取代不可用的 dart:io。
  file: ^7.0.1
  web: ^1.1.1

  cupertino_icons: ^1.0.8

dependency_overrides:
  re_editor:
    path: ../qfli_studio_core/vendor/re_editor

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
